<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Summit Industries LLC{% endblock %}</title>
  <script>
    (() => {
      const allowed = new Set(['dark', 'light', 'orange']);
      const saved = localStorage.getItem('summitTheme') || 'dark';
      document.documentElement.dataset.theme = allowed.has(saved) ? saved : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="/static/css/main.css?v=6">
  {% block head %}{% endblock %}
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="/static/images/logo.png" alt="Summit Industries LLC" class="brand-logo">
      <span class="brand-text">Summit Industries LLC</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-item {% if page == 'dashboard' %}active{% endif %}">
        <span class="nav-icon">&#9632;</span>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="/discovery" class="nav-item {% if page == 'discovery' %}active{% endif %}">
        <span class="nav-icon">&#9788;</span>
        <span class="nav-label">Discovery</span>
      </a>
      <a href="/leads" class="nav-item {% if page == 'leads' %}active{% endif %}">
        <span class="nav-icon">&#9776;</span>
        <span class="nav-label">Leads</span>
      </a>
      <a href="/website-monitor" class="nav-item {% if page == 'website_monitor' %}active{% endif %}">
        <span class="nav-icon">&#9673;</span>
        <span class="nav-label">Website Monitor</span>
      </a>
      <a href="/settings" class="nav-item {% if page == 'settings' %}active{% endif %}">
        <span class="nav-icon">&#9881;</span>
        <span class="nav-label">Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <span class="sidebar-version">v2.0</span>
      <div class="theme-control">
        <select class="theme-select" id="themeSelect" aria-label="Theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="orange">Orange</option>
        </select>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
      <div class="topbar-actions">{% block topbar_actions %}{% endblock %}</div>
    </header>
    <div class="content-area">
      {% block content %}{% endblock %}
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/static/js/app.js?v=4"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
